<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulated File Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="desktop">
    <canvas id="bg-particles"></canvas>
    <div id="window">
      <!-- Title Bar -->
      <div class="title-bar">
        <div class="title-bar-left">
          <svg class="title-icon" viewBox="0 0 16 16" width="16" height="16">
            <rect x="1" y="4" width="14" height="11" fill="#FFD700" stroke="#AA8800" stroke-width="1"/>
            <rect x="1" y="2" width="7" height="4" fill="#FFD700" stroke="#AA8800" stroke-width="1"/>
          </svg>
          <span class="title-text">Simulated File Manager</span>
        </div>
        <div class="title-bar-controls">
          <button class="win-btn minimize" title="Minimize">_</button>
          <button class="win-btn maximize" title="Maximize">&#9633;</button>
          <button class="win-btn close" title="Close">&#215;</button>
        </div>
      </div>

      <!-- Menu Bar -->
      <div class="menu-bar">
        <span class="menu-item">File</span>
        <span class="menu-item">Edit</span>
        <span class="menu-item">View</span>
        <span class="menu-item">Help</span>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <button id="btn-back" class="tool-btn" title="Back">&#9664; Back</button>
        <button id="btn-up" class="tool-btn" title="Up one level">&#9650; Up</button>
        <div class="toolbar-sep"></div>
        <button id="btn-new-folder" class="tool-btn" title="New Folder">+ Folder</button>
        <button id="btn-new-file" class="tool-btn" title="New File">+ File</button>
        <div class="toolbar-sep"></div>
        <button id="btn-rename" class="tool-btn" title="Rename">Rename</button>
        <button id="btn-delete" class="tool-btn" title="Delete">Delete</button>
        <div class="toolbar-spacer"></div>
        <div class="view-toggle">
          <button id="btn-grid-view" class="tool-btn active" title="Grid view">Grid</button>
          <button id="btn-list-view" class="tool-btn" title="List view">List</button>
        </div>
      </div>

      <!-- Address Bar -->
      <div class="address-bar">
        <span class="address-label">Address:</span>
        <div id="breadcrumb" class="breadcrumb"></div>
      </div>

      <!-- Main Content -->
      <div class="content-area">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar">
          <div class="sidebar-header">Folders</div>
          <div id="folder-tree"></div>
        </div>

        <!-- File Area -->
        <div id="file-area" class="file-area grid-view"></div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <span id="status-count">0 item(s)</span>
        <span id="status-selected"></span>
      </div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="context-menu" style="display:none;">
    <div class="ctx-item" data-action="open">Open</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" data-action="new-folder">New Folder</div>
    <div class="ctx-item" data-action="new-file">New File</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item" data-action="rename">Rename</div>
    <div class="ctx-item" data-action="delete">Delete</div>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal" class="modal-window">
      <div class="modal-title-bar">
        <span id="modal-title">Dialog</span>
        <button class="win-btn close modal-close">&#215;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <div id="crt-overlay"></div>
  <script src="js/app.js"></script>
</body>
</html>
